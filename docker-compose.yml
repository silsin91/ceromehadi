services:
  chrome:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile.chrome
    shm_size: 2gb
    environment:
      DISPLAY: ":99"
      SCREEN_WIDTH: "${SCREEN_WIDTH:-1365}"
      SCREEN_HEIGHT: "${SCREEN_HEIGHT:-768}"
      SCREEN_DEPTH: "${SCREEN_DEPTH:-24}"
      VNC_PASSWORD: "${VNC_PASSWORD:-codespace}"
      CHROME_PROXY_SERVER: "${CHROME_PROXY_SERVER-socks5://v2ray:10808}"
    volumes:
      - chrome-data:/data
    depends_on:
      - v2ray
    restart: unless-stopped
    networks:
      - browser

  v2ray:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile.v2ray
    environment:
      V2RAY_UUID: "${V2RAY_UUID:-b831381d-6324-4d53-ad4f-8cda48b30811}"
      V2RAY_WS_PATH: "${V2RAY_WS_PATH:-/v2ray}"
      V2RAY_PUBLIC_PORT: "8080"
      V2RAY_SOCKS_PORT: "10808"
    volumes:
      - ./.devcontainer/v2ray-entrypoint.sh:/usr/local/bin/v2ray-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/v2ray-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - browser

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-6080}:6080"
    volumes:
      - ./.devcontainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chrome
      - v2ray
    restart: unless-stopped
    networks:
      - browser

volumes:
  chrome-data:

networks:
  browser:
    driver: bridge
