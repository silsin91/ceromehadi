services:
  chrome:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile.chrome
    shm_size: 2gb
    environment:
      DISPLAY: ":99"
      SCREEN_WIDTH: "${SCREEN_WIDTH:-1365}"
      SCREEN_HEIGHT: "${SCREEN_HEIGHT:-768}"
      SCREEN_DEPTH: "${SCREEN_DEPTH:-24}"
      VNC_PASSWORD: "${VNC_PASSWORD:-codespace}"
      CHROME_PROXY_SERVER: "${CHROME_PROXY_SERVER-socks5://v2ray:10808}"
    volumes:
      - chrome-data:/data
    depends_on:
      - v2ray
    restart: unless-stopped
    networks:
      - browser

  novnc:
    image: theasp/novnc:latest
    environment:
      VNC_SERVER: "chrome:5900"
      RESOLUTION: "${SCREEN_WIDTH:-1365},${SCREEN_HEIGHT:-768}"
      RUN_XTERM: "no"
      RUN_FLUXBOX: "no"
    command: >
      sh -c "websockify --web /usr/share/novnc --heartbeat=30 6080 chrome:5900"
    depends_on:
      - chrome
    restart: unless-stopped
    networks:
      - browser

  v2ray:
    image: teddysun/xray:latest
    volumes:
      - ./.devcontainer/vless-config.generated.json:/etc/xray/config.json:ro
    restart: unless-stopped
    networks:
      - browser

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-6080}:6080"
    volumes:
      - ./.devcontainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - novnc
      - v2ray
    restart: unless-stopped
    networks:
      - browser

volumes:
  chrome-data:

networks:
  browser:
    driver: bridge
