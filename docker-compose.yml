services:
  chrome:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile.chrome
    shm_size: 2gb
    environment:
      DISPLAY: ":99"
      SCREEN_WIDTH: "${SCREEN_WIDTH:-1365}"
      SCREEN_HEIGHT: "${SCREEN_HEIGHT:-768}"
      SCREEN_DEPTH: "${SCREEN_DEPTH:-24}"
      VNC_PASSWORD: "${VNC_PASSWORD:-codespace}"
      CHROME_PROXY_SERVER: "${CHROME_PROXY_SERVER-socks5://xray:10808}"
    volumes:
      - chrome-data:/data
    depends_on:
      - xray
    restart: unless-stopped
    networks:
      - browser

  xray:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile.xray
    environment:
      XRAY_UUID: "${XRAY_UUID:-b831381d-6324-4d53-ad4f-8cda48b30811}"
      XRAY_WS_PATH: "${XRAY_WS_PATH:-/vless}"
      XRAY_PUBLIC_PORT: "8080"
      XRAY_SOCKS_PORT: "10808"
      PUBLIC_PORT: "${PUBLIC_PORT:-6080}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      PUBLIC_TAG: "${PUBLIC_TAG:-Chrome-Codespace}"
      CODESPACE_NAME: "${CODESPACE_NAME:-}"
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: "${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}"
    restart: unless-stopped
    networks:
      - browser

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-6080}:6080"
    volumes:
      - ./.devcontainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chrome
      - xray
    restart: unless-stopped
    networks:
      - browser

volumes:
  chrome-data:

networks:
  browser:
    driver: bridge
